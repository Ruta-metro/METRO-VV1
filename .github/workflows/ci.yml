name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: metroruta
          POSTGRES_USER: metroruta
          POSTGRES_PASSWORD: metroruta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metroruta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y probar
        run: ./mvnw -B verify
