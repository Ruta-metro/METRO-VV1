services:
  db:
    image: postgres:16
    container_name: metroruta-db
    environment:
      POSTGRES_DB: metroruta
      POSTGRES_USER: metroruta
      POSTGRES_PASSWORD: metroruta
    ports:
      - "5432:5432"
    volumes:
      - metroruta-data:/var/lib/postgresql/data

volumes:
  metroruta-data:
